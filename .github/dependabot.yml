# Check twice weekly in UTC, with stable times per repository, ecosystem and directory.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "41 10 * * 1,4"
      timezone: Etc/UTC
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "39 8 * * 3,6"
      timezone: Etc/UTC
